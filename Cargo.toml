[package]
name = "bevy_document_extend"
# Pre-release: ships with a local patch for oxml-layout 0.11.0 (see
# patches/oxml-layout/README.PATCH.md). Until upstream fixes the
# non-exhaustive fontdb::Source match, `cargo publish` requires
# `--no-verify` because verification resolves unpatched crates.io deps.
version = "0.1.0-alpha.0"
edition = "2024"
description = "Bevy document rendering extensions: rasterize PDF/DOCX/XLSX/PPTX pages to Bevy images"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swordreforge/bevy_document_extend"
keywords = ["bevy", "pdf", "docx", "xlsx", "render"]
categories = ["game-engines", "multimedia"]

[features]
default = ["pdf-hayro", "docx-rdocx", "xlsx-calamine-office2pdf", "pptx-office"]
pdf = ["pdf-hayro"]
pdf-hayro = ["dep:hayro"]
pdf-zpdf = ["dep:zpdf"]
docx = ["docx-rdocx"]
docx-rdocx = ["dep:rdocx"]
xlsx = ["xlsx-calamine-office2pdf"]
xlsx-calamine = ["dep:calamine"]
xlsx-office2pdf = ["dep:office2pdf"]
# Render-only wiring: xlsx -> office2pdf -> pdf -> hayro rasterizer, so
# `xlsx`/`xlsx-calamine-office2pdf` alone renders out of the box.
xlsx-calamine-office2pdf = ["xlsx-calamine", "xlsx-office2pdf", "pdf-hayro"]
pptx = ["pptx-office"]
# Probe/extract use zip+quick-xml directly on the OPC package; render-only
# wiring: pptx -> office2pdf -> pdf -> hayro rasterizer, mirroring xlsx.
pptx-office = ["dep:zip", "dep:quick-xml", "pptx-office2pdf", "pdf-hayro"]
pptx-office2pdf = ["dep:office2pdf"]

[dependencies]
bevy = { version = "0.19.1", features = ["gestures"] }
image = "0.25"
hayro = { version = "0.7", optional = true }
zpdf = { version = "0.13", optional = true }
rdocx = { version = "0.13", optional = true, default-features = false }
calamine = { version = "0.36", optional = true }
office2pdf = { version = "0.7", optional = true, default-features = false }
zip = { version = "0.6", optional = true, default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", optional = true }

[dev-dependencies]
rdocx = { version = "0.13", default-features = false }
rust_xlsxwriter = "0.99"

[patch.crates-io]
oxml-layout = { path = "patches/oxml-layout" }
